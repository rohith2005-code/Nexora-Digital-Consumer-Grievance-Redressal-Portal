services:
  - type: web
    name: consumercare-portal
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate && python seed_data.py && gunicorn grievance_core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
